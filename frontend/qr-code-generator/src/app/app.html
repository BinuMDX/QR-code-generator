<div style="text-align:center; margin-top:50px">
  <h1>QR Code Generator</h1>

  <input [(ngModel)]="inputText" placeholder="Enter text or URL" style="padding: 10px; width: 300px;">
  <button (click)="generateQR()" style="margin-left:10px; padding:10px 20px;">Generate</button>

  <div *ngIf="qrImage" style="margin-top:30px;">
    <h3>Your QR Code:</h3>
    <img [src]="qrImage" alt="QR Code" width="200" height="200">
  </div>
</div>



<router-outlet />
